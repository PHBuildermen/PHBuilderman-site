<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHBuilderman Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <span class="phbuilderman">PHBuilderman</span> <span class="site">site</span>
    </div>
  </header>

  <main style="max-width:420px; margin:80px auto; padding:20px;">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email" style="width:100%; padding:12px; margin:8px 0;"><br>
    <input type="password" id="loginPass" placeholder="Password" style="width:100%; padding:12px; margin:8px 0;"><br>
    <button class="btn btn-primary" onclick="handleLogin()" style="width:100%;">Login</button>
    <button class="btn" onclick="loginWithGoogle()" style="width:100%; margin-top:10px;">Continue with Google</button>

    <hr style="margin:30px 0">

    <h2>Create Account</h2>
    <input type="text" id="regUsername" placeholder="Username" style="width:100%; padding:12px; margin:8px 0;"><br>
    <input type="email" id="regEmail" placeholder="Email" style="width:100%; padding:12px; margin:8px 0;"><br>
    <input type="password" id="regPass" placeholder="Password" style="width:100%; padding:12px; margin:8px 0;"><br>
    <button class="btn btn-primary" onclick="handleRegister()" style="width:100%;">Create Account</button>
  </main>

  <script type="module">
    import { login, register, loginWithGoogle } from './auth.js';

    window.handleLogin = () => {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;
      login(email, pass);
    };

    window.handleRegister = () => {
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPass').value;
      if (username && email && pass) register(email, pass, username);
      else alert("Please fill all fields");
    };

    window.loginWithGoogle = loginWithGoogle;
  </script>
</body>
</html>
