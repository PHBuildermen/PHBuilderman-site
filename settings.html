<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - PHBuilderman Site</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <div class="logo"><span class="phbuilderman">PHBuilderman</span> <span class="site">site</span></div>
    <button onclick="logout()" class="btn">Logout</button>
  </header>

  <div style="max-width:600px; margin:50px auto; padding:20px; background:rgba(255,255,255,0.1); border-radius:16px;">
    <h2>Settings</h2>
    <p><strong>Email:</strong> <span id="userEmail"></span></p>
    
    <label>
      <input type="checkbox" id="notify" checked> Receive email notifications for new posts
    </label><br><br>
    
    <button class="btn btn-primary" onclick="alert('Notification preference saved! (Demo)')">Save Settings</button>
  </div>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    auth.onAuthStateChanged(user => {
      if (user) document.getElementById('userEmail').textContent = user.email;
    });
  </script>
</body>
</html>
