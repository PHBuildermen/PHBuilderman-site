<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts - PHBuilderman Site</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <span class="phbuilderman">PHBuilderman</span> 
      <span class="site">site</span>
    </div>
    
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="posts.html" class="btn">🏠 Posts</a>
      <a href="dashboard.html" class="btn btn-primary">+ New Post</a>
      <a href="settings.html" class="btn">⚙️ Settings</a>
      <button onclick="logout()" class="btn">Logout</button>
    </div>
  </header>

  <div style="padding: 2rem 5%; max-width: 1200px; margin: 0 auto;">
    <h1 style="margin-bottom: 1.5rem;">All Posts</h1>
    
    <!-- Search Bar -->
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search videos, titles, or categories..." 
      style="width:100%; padding:15px 20px; border-radius:50px; border:none; margin-bottom:2rem; font-size:1.1rem;"
      onkeyup="searchPosts()">
  </div>

  <!-- Posts Grid -->
  <div class="card-grid" id="posts-container">
    <!-- Posts will load here via JavaScript -->
  </div>

  <!-- Scripts -->
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    // ==================== FULL SCRIPT FOR POSTS PAGE ====================

    let currentUser = null;
    let allPosts = [];

    // Auth State Listener
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (!user) {
        window.location.href = "index.html";
      } else {
        loadPosts();
      }
    });

    // Load All Posts
    async function loadPosts() {
      try {
        const snapshot = await db.collection("posts")
          .orderBy("date", "desc")
          .get();

        allPosts = [];
        const container = document.getElementById("posts-container");
        container.innerHTML = "";

        snapshot.forEach(doc => {
          const p = doc.data();
          allPosts.push({ id: doc.id, ...p });

          const cardHTML = `
            <div class="card">
              ${p.thumbnail ? 
                `<img src="\( {p.thumbnail}" alt=" \){p.title}" style="width:100%; height:200px; object-fit:cover;">` : 
                `<div style="height:200px; background:#333; display:flex; align-items:center; justify-content:center; color:#888;">
                  No Thumbnail
                </div>`
              }
              
              <div class="card-content">
                <span class="tag">${p.category || 'Uncategorized'}</span>
                <h3>${p.title}</h3>
                <p>${p.description ? p.description.substring(0, 130) + '...' : ''}</p>
                <small>${new Date(p.date).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' })}</small>
                
                <div style="margin: 15px 0; display:flex; gap: 20px; font-size: 1.3rem;">
                  <span onclick="incrementViews('${doc.id}')" style="cursor:pointer; user-select:none;">
                    👁 <strong>${p.views || 0}</strong>
                  </span>
                  <span onclick="likePost('${doc.id}')" style="cursor:pointer; user-select:none;">
                    ❤️ <strong>${p.likes || 0}</strong>
                  </span>
                </div>
                
                <a href="${p.youtubeLink}" target="_blank" class="btn btn-primary" style="width:100%; text-align:center; display:block;">
                  ▶ Watch on YouTube
                </a>
              </div>
            </div>
          `;
          container.innerHTML += cardHTML;
        });

      } catch (error) {
        console.error("Error loading posts:", error);
        document.getElementById("posts-container").innerHTML = `<p style="color:red; text-align:center;">Error loading posts. Please try again.</p>`;
      }
    }

    // Increment Views
    async function incrementViews(postId) {
      try {
        await db.collection("posts").doc(postId).update({
          views: firebase.firestore.FieldValue.increment(1)
        });
        loadPosts(); // Refresh
      } catch (e) {
        console.error(e);
      }
    }

    // Like Post
    async function likePost(postId) {
      try {
        await db.collection("posts").doc(postId).update({
          likes: firebase.firestore.FieldValue.increment(1)
        });
        loadPosts(); // Refresh
      } catch (e) {
        console.error(e);
      }
    }

    // Search Function
    function searchPosts() {
      const term = document.getElementById("searchInput").value.toLowerCase().trim();
      const container = document.getElementById("posts-container");
      container.innerHTML = "";

      const filtered = allPosts.filter(post => 
        post.title.toLowerCase().includes(term) ||
        (post.description && post.description.toLowerCase().includes(term)) ||
        (post.category && post.category.toLowerCase().includes(term))
      );

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; grid-column:1/-1; padding:50px;">No matching posts found.</p>`;
        return;
      }

      filtered.forEach(p => {
        const postId = p.id;
        const cardHTML = `
          <div class="card">
            ${p.thumbnail ? 
              `<img src="\( {p.thumbnail}" alt=" \){p.title}" style="width:100%; height:200px; object-fit:cover;">` : 
              `<div style="height:200px; background:#333; display:flex; align-items:center; justify-content:center; color:#888;">No Thumbnail</div>`
            }
            
            <div class="card-content">
              <span class="tag">${p.category || 'Uncategorized'}</span>
              <h3>${p.title}</h3>
              <p>${p.description ? p.description.substring(0, 130) + '...' : ''}</p>
              <small>${new Date(p.date).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' })}</small>
              
              <div style="margin: 15px 0; display:flex; gap: 20px; font-size: 1.3rem;">
                <span onclick="incrementViews('${postId}')" style="cursor:pointer; user-select:none;">
                  👁 <strong>${p.views || 0}</strong>
                </span>
                <span onclick="likePost('${postId}')" style="cursor:pointer; user-select:none;">
                  ❤️ <strong>${p.likes || 0}</strong>
                </span>
              </div>
              
              <a href="${p.youtubeLink}" target="_blank" class="btn btn-primary" style="width:100%; text-align:center; display:block;">
                ▶ Watch on YouTube
              </a>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    // Logout Function
    function logout() {
      auth.signOut().then(() => {
        window.location.href = "index.html";
      });
    }

    // Auto load posts when page loads
    window.onload = () => {
      // loadPosts() is called inside auth.onAuthStateChanged
    };
  </script>
</body>
</html>
