  <header>

  <script>
    let allPosts = [];

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else loadPosts();
    });

    async function loadPosts() {
      const snapshot = await db.collection("posts").orderBy("date", "desc").get();
      allPosts = [];
      const container = document.getElementById("posts-container");
      container.innerHTML = "";

      snapshot.forEach(doc => {
        const p = doc.data();
        const postId = doc.id;
        allPosts.push({id: postId, ...p});

        const html = `
          <div class="card">
            \( {p.thumbnail ? `<img src=" \){p.thumbnail}" alt="${p.title}">` : ''}
            <div class="card-content">
              <span class="tag">${p.category || 'General'}</span>
              <h3>${p.title}</h3>
              <p>${(p.description || '').substring(0, 130)}...</p>
              <small>${new Date(p.date).toLocaleDateString('en-PH')}</small>
              
              <div style="margin:15px 0; display:flex; gap:20px; font-size:1.3rem;">
                <span onclick="incrementViews('${postId}')" style="cursor:pointer">👁 ${p.views || 0}</span>
                <span onclick="likePost('${postId}')" style="cursor:pointer">❤️ ${p.likes || 0}</span>
              </div>
              
              <a href="${p.youtubeLink}" target="_blank" class="btn btn-primary">▶ Watch on YouTube</a>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    async function incrementViews(id) {
      await db.collection("posts").doc(id).update({ views: firebase.firestore.FieldValue.increment(1) });
      loadPosts();
    }

    async function likePost(id) {
      await db.collection("posts").doc(id).update({ likes: firebase.firestore.FieldValue.increment(1) });
      loadPosts();
    }

    function searchPosts() {
      const term = document.getElementById("searchInput").value.toLowerCase();
      const container = document.getElementById("posts-container");
      container.innerHTML = "";

      const filtered = allPosts.filter(p => 
        p.title.toLowerCase().includes(term) || 
        (p.description && p.description.toLowerCase().includes(term))
      );

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; padding:50px; grid-column:1/-1;">No posts found.</p>`;
        return;
      }

        // You can reuse the card generation logic
      });
    }

    function logout() {
      auth.signOut().then(() => window.location.href = "index.html");
    }
  </script>
